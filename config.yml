baseURL: "https://zhiwei.tw"
title: ZHIWEI
paginate: 10
theme: hugo-PaperMod

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

googleAnalytics: G-FYKGBCQ5HP

# minify:
#   disableXML: true
#   minifyOutput: true

menu:
  main:
    - name: Search
      url: search/
      weight: 10
    - identifier: categories
      name: categories
      url: categories/
      weight: 20
    - identifier: tags
      name: tags
      url: tags/
      weight: 30
    - identifier: about
      name: About Me
      url: about/
      weight: 40
      
# Search Configs
outputs:
    home:
        - HTML
        - RSS
        - JSON # is necessary

# Catergory Configs
taxonomies:
    category: categories
    tag: tags

params:
  # Global Settings
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  description: "Welcome to ZHIWEI's blog"
  author: ZHIWEI # author: ["Me", "You"] # multiple authors
  images: 
    - /apple-touch-icon.png
  DateFormat: "2006-01-02 15:04:05 UTC+8"
  defaultTheme: auto # auto, light, dark
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false
  utter:
    repo: zhiweitong/cmdsforblog
    issueTerm: pathname
    theme: photon-dark

  assets:
    # disableHLJS: true # to disable highlight.js
    # disableFingerprinting: true
    # favicon: "/favicon.ico"
    # favicon16x16:  "/favicon-16x16.png"
    # favicon32x32:  "/favicon-32x32.png"
    # apple_touch_icon:  "/apple-touch-icon.png"
    # safari_pinned_tab: "<link / abs url>"

  label:
    text: "ZHIWEI"

  # profile-mode
  profileMode:
    enabled: false # needs to be explicitly set
    title: "ZHIWEI"
    subtitle: "碳跟鑽石最大的差別是壓力。"
    imageUrl: "<img location>"
    imageWidth: 120
    imageHeight: 120
    imageTitle: my image
    buttons:
      - name: Posts
        url: posts
      - name: Tags
        url: tags

  # home-info mode
  homeInfoParams:
    Title: "歡迎來到我的 blog \U0001F44B"
    Content: 碳跟鑽石最大的差別是壓力。

  socialIcons:
    - name: email
      url: "mailto:tong@zhiwei.tw"
    - name: github
      url: "https://github.com/zhiweitong"
    - name: linkedin
      url: "https://www.linkedin.com/in/zhiweitong"

  analytics:
    google:
      SiteVerificationTag: "XYZabc"
    bing:
      SiteVerificationTag: "XYZabc"
    yandex:
      SiteVerificationTag: "XYZabc"

  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: true # hide on single page

  editPost:
    URL: "https://github.com/<path_to_repo>/content"
    Text: "Suggest Changes" # edit text
    appendFilePath: true # to append file path to Edit link

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

